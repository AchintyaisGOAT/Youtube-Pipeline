[project]
name = "youtube-pipeline"
version = "0.1.0"
description = "OurGreatHistory: trending history topic -> researched long-form video + Shorts + upload kit"
requires-python = ">=3.11,<3.13"
dependencies = [
    # config
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "tzdata",              # Windows has no system zoneinfo database
    # data (SQLite — single file, no server, no migrations)
    "sqlalchemy",
    # http + resilience + logging
    "httpx",
    "tenacity",
    "loguru",
    # LLMs (Groq's `openai` SDK is added in S2 with the routing that uses it)
    "google-genai",
    # local AI, CPU only (README §2: no CUDA on this machine)
    "kokoro-onnx",
    "soundfile",
    "faster-whisper",
    # media
    "pillow",
    "pysubs2",
]

[project.scripts]
ogh = "app.cli:main"

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
