[project]
name = "youtube-pipeline"
version = "0.1.0"
description = "Automated history/education YouTube video pipeline (long-form + Shorts)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # config
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    # data + queue
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "procrastinate",
    # http + resilience
    "httpx",
    "hishel",
    "tenacity",
    "aiolimiter",
    "loguru",
    "apprise",
    # storage abstraction
    "fsspec",
    # google / youtube
    "google-genai",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    # discovery (best-effort)
    "pytrends",
    # local AI
    #   NOTE: faster-whisper pulls onnxruntime (CPU) for its VAD; kokoro-onnx[gpu]
    #   pulls onnxruntime-gpu. Both installed = import conflict. After `uv sync`,
    #   verify `python -c "import onnxruntime as ort; print(ort.get_available_providers())"`
    #   shows CUDAExecutionProvider; if not, `uv pip uninstall onnxruntime` (keep -gpu).
    "kokoro-onnx[gpu]",
    "soundfile",
    "faster-whisper",
    "huggingface-hub",
    # media
    "pillow",
    "pysubs2",
    # review dashboard
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[tool.uv]
# This repo is an application, not an installable library — don't try to build it.
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
