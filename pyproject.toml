[project]
name = "youtube-pipeline"
version = "0.1.0"
description = "Automated history/education YouTube video pipeline (long-form + Shorts)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # config
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "tzdata",              # Windows has no system zoneinfo database
    # data + queue
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "procrastinate",
    # http + resilience
    "httpx",
    "hishel",
    "tenacity",
    "aiolimiter",
    "loguru",
    "apprise",
    # storage abstraction
    "fsspec",
    # google / youtube
    "google-genai",
    "google-api-python-client",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    # discovery (best-effort)
    "pytrends",
    # local AI
    #   NOTE: faster-whisper pulls CPU onnxruntime for its VAD; kokoro-onnx[gpu]
    #   pulls onnxruntime-gpu. After `uv sync`, verify
    #   `python -c "import onnxruntime as o; print(o.get_available_providers())"`
    #   lists CUDAExecutionProvider; if not, `uv pip uninstall onnxruntime` (keep -gpu).
    "kokoro-onnx[gpu]",
    "soundfile",
    "faster-whisper",
    "huggingface-hub",
    # media
    "pillow",
    "pysubs2",
    # review dashboard
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "python-multipart",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
