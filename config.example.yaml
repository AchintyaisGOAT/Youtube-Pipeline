# yaml-language-server: $schema=./config.schema.json
# Single source of truth for channel + behaviour config.
# Copy to config.yaml, edit, then: uv run python scripts/load_config.py config.yaml
# (loads it into the `channel` DB row with an incrementing config_version)
# Section refs like "DESIGN.md #NN" point at DESIGN.md section 6 (Risks & improvements).

config_version: 1

# All schedules and daily jobs use this timezone (DESIGN.md #16 was: none set).
timezone: "America/New_York"

channel:
  name: ""
  handle: ""
  description: ""
  audience: "curious people who want to be entertained, not lectured at"
  # Animated/illustrated entertainment channel, not a narrated documentary -- direct
  # product feedback on an early real render (dry narration over still photos read as
  # "sluggish"). See images.art_style below for the matching visual direction.
  tone: "energetic, fun, fast-paced, a little cheeky -- like a friend telling you the wildest true story they know, never a dry lecture; still accurate and well-sourced"
  language: "en-US"

topics:
  in_scope:
    - "world history pre-2000"
    - "history of science and technology"
  # DESIGN.md #44 — two tiers. Well-sourced history legitimately covers Rome, WWII,
  # colonialism etc., so those are NOT blanket-banned; only recent / politically-live
  # material is hard-vetoed, and heavy subjects are routed to a human yes/no.
  auto_veto:            # candidate is skipped, no human involved
    - "events within the last 10 years"
    - "active elections / party politics"
    - "ongoing armed conflicts"
    - "living-person allegations or controversy"
    - "medical, legal, or financial advice"
  manual_review:        # allowed, but a human approves/rejects before scripting
    - "genocide / atrocity as the primary subject"
    - "religion as the primary subject"
    - "still-actively-disputed historical framing"

discovery:
  primary: "wikimedia_pageviews"   # DESIGN.md #26 — the only signal discover.py implements right now
  also: []                        # reserved for on_this_day/reddit/pytrends if added later; not implemented yet
  run: "weekly Mon 06:00"          # DESIGN.md eff#7 — discovery is weekly; a daily tick advances queued work
  target_long_form_per_month: 6

video:
  long_form:
    target_seconds_min: 180  # 3 min -- script.py fits length to the story, not the reverse
    target_seconds_max: 480  # 8 min
    resolution: [1920, 1080]
    fps: 30
  shorts:
    per_long_form: 7
    max_seconds: 55                # style choice, well under YouTube's 180s Shorts limit (DESIGN.md #15)
    resolution: [1080, 1920]
    fps: 30
  loudness_lufs: -14
  music_bed_lufs: -18
  image_seconds_min: 2.5
  image_seconds_max: 3.5
  encoder: "auto"                  # auto = h264_nvenc if available else libx264 (DESIGN.md eff#8)
  render_concurrency: 1           # consumer GPUs cap concurrent NVENC sessions

voice:                             # Kokoro ONNX — verify IDs against the kokoro-onnx v1.0 voice list
  primary: "bm_george"
  secondary_for_quotes: "bf_emma"
  words_per_second: 2.6            # measured once, then calibrate script length (DESIGN.md #15)
  paragraph_pause_ms: 400

subtitles:
  font_file: "assets/fonts/Inter-Regular.ttf"   # path, not family name — libass needs the file
  size: 34
  position: "bottom-center"
  max_lines: 2
  highlight_color: "#FFD23F"
  karaoke: true
  upload_sidecar_srt: true         # DESIGN.md #36

alignment:
  whisper_model: "small.en"
  mismatch_fallback_ratio: 0.15    # DESIGN.md #14

images:
  # Segment visuals are AI-generated illustrations (Gemini image models), not archival-
  # photo search -- prepended to every generation prompt, so this is what keeps a whole
  # video's illustrations visually consistent. Edit freely per channel's desired look.
  art_style: "Flat 2D cartoon illustration, bold clean outlines, vibrant saturated colors, simple shapes, fun educational animated-explainer style, 16:9 widescreen."
  per_video_max: 60

publish:
  category: "Education"
  made_for_kids: false
  synthetic_content_disclosure: true   # DESIGN.md #2
  api_visibility: "private"            # audit note — publish manually in Studio
  playlist_id: ""
  schedule:                            # times are in `timezone` above
    long_form: ["Tue 15:00", "Fri 15:00"]
    shorts: ["daily 12:00"]

ops:
  media_retention_days: 30            # DESIGN.md #23
  delete_intermediates_on_success: true
  min_free_gb_before_render: 15
  alert_on_budget_pct: 80
  backup_target: "E:/backups"         # DESIGN.md #9 / #42

models:                               # pin revisions for reproducibility (DESIGN.md #43)
  kokoro_revision: ""
  whisper_revision: ""
  ffmpeg_version: ""

test_mode: true                       # DESIGN.md #32 — dry-run / unlisted until flipped
