# Channel + behaviour settings. Committed — no secrets here (those go in .env).
# Validated on every run by app/config.py; section refs point at README.md.

timezone: "America/New_York"

channel:
  name: "OurGreatHistory"
  handle: "@OurGreatHistory"
  audience: "curious people who want to be entertained, not lectured at"
  tone: >-
    energetic, fun, fast-paced, a little cheeky -- like a friend telling you the wildest true
    story they know, never a dry lecture; always accurate and sourced
  language: "en-US"

topics:                         # README §4.3
  in_scope:
    - "world history pre-2000"
    - "history of science and technology"
  auto_veto:                    # skipped, no human involved; everything else proceeds
    - "events within the last 10 years"
    - "active elections / party politics"
    - "ongoing armed conflicts"
    - "living-person allegations or controversy"
    - "medical, legal, or financial advice"

discovery:                      # README §4.1 — runs when no passed topic is waiting
  sources: ["trending", "on_this_day"]
  max_candidates: 20

llm:                            # README §5 — confirm IDs/limits in AI Studio + Groq console
  writer: "gemini-3.8-flash"    # script + metadata
  writer_fallback: "openai/gpt-oss-120b"
  checker: "gemini-3.5-flash-lite"  # script vs articles; must differ from writer
  worker: "openai/gpt-oss-120b" # gate + scene plan
  worker_fallback: "gemini-3.5-flash-lite"
  image: "gemini-3.1-flash-image"   # AI illustration fallback only

research:
  linked_articles: 3            # extra Wikipedia articles linked from the lead section

video:                          # README §6.4
  long_form:
    seconds_min: 180
    seconds_max: 480
    resolution: [1920, 1080]
    fps: 30
  shorts:
    per_video: 7
    max_seconds: 55
    resolution: [1080, 1920]
    fps: 30
  scene_seconds_min: 5
  scene_seconds_max: 7
  loudness_lufs: -14
  music_lufs: -18
  encoder: "auto"               # auto = h264_qsv if it works, else libx264

images:                         # README §6.1
  sources: ["wikimedia_commons", "library_of_congress", "smithsonian"]
  ai_fallback: true             # false = never generate AI images
  ai_style: >-
    Vintage historical illustration in the style of a period engraving or print, muted
    colors, fine linework, 16:9 widescreen, no text.
  max_images: 80

voice:                          # README §6.2 — verify IDs against the kokoro-onnx voice list
  primary: "bm_george"
  quotes: "bf_emma"
  words_per_second: 2.6
  paragraph_pause_ms: 400

alignment:
  whisper_model: "small.en"
  mismatch_fallback_ratio: 0.15

subtitles:
  font_file: "assets/fonts/Inter-Regular.ttf"
  size: 34
  position: "bottom-center"
  highlight_color: "#FFD23F"
  karaoke: true

publish:                        # README §7 — goes into each upload kit's checklist
  category: "Education"
  made_for_kids: false
  schedule:
    long_form: ["Tue 15:00", "Fri 15:00"]
    shorts: ["daily 12:00"]

ops:
  min_free_gb: 15
  keep_output_days: 30
